<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8" />

  <title>Render-Native Sandbox Output</title>

  <style>

    :root {

      color-scheme: dark;

      font-family: Inter, ui-sans-serif, system-ui, sans-serif;

      background: #0f1117;

      color: #f4f7fb;

    }

    body {

      margin: 0;

      min-height: 100vh;

      display: grid;

      place-items: center;

      background:

        radial-gradient(circle at top left, rgba(255, 46, 169, 0.16), transparent 32rem),

        linear-gradient(135deg, #0f1117 0%, #171a23 100%);

    }

    #sandbox-render-root {

      width: min(720px, calc(100vw - 48px));

    }

    .rn-node {

      box-sizing: border-box;

    }

    .rn-container-node {

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 24px;

      box-shadow: 0 24px 80px rgba(0,0,0,0.32);

      backdrop-filter: blur(16px);

    }

    .rn-layout-stack {

      display: flex;

      flex-direction: column;

      gap: 16px;

      align-items: stretch;

      padding: 28px;

    }

    .rn-layout-card {

      border-radius: 18px;

      padding: 18px 20px;

      background: rgba(255,255,255,0.06);

    }

    .rn-layout-badge {

      align-self: flex-start;

      border-radius: 999px;

      padding: 8px 14px;

      font-size: 0.78rem;

      font-weight: 800;

      letter-spacing: 0.12em;

      text-transform: uppercase;

    }

    .rn-style-background {

      background: rgba(22,25,34,0.86);

    }

    .rn-style-text {

      font-size: clamp(1.8rem, 4vw, 3rem);

      line-height: 1.05;

      font-weight: 850;

    }

    .rn-style-accent {

      color: #ff8bd3;

      font-size: 1.05rem;

      line-height: 1.6;

    }

    .rn-style-evidence {

      color: #a8d8ff;

      line-height: 1.6;

    }

    .rn-style-warning {

      color: #ffd28a;

    }

    .rn-style-status-pass {

      color: #102217;

      background: #8ff0b0;

    }

    .rn-list-node {

      margin: 0;

      padding-left: 1.4rem;

      background: rgba(255,255,255,0.04);

    }

    .rn-list-node li + li {

      margin-top: 0.6rem;

    }

  </style>

</head>

<body>

  <main

    id="sandbox-render-root"

    data-schema-version="phase736.render-native-payload.v3"

    data-scene-pattern="status_card"

  >

    

      <div class="rn-node rn-container-node rn-style-background rn-layout-stack" data-node-id="root-node" data-style-token="background" data-layout-token="stack">

        

      <div class="rn-node rn-text-node rn-style-text rn-layout-card" data-node-id="title-node" data-style-token="text" data-layout-token="card">

        Render-Native Sandbox Active

      </div>

    


      <div class="rn-node rn-text-node rn-style-accent rn-layout-card" data-node-id="body-node" data-style-token="accent" data-layout-token="card">

        Deterministic payload emission validated outside live Preview.

      </div>

    


      <div class="rn-node rn-text-node rn-style-status-pass rn-layout-badge" data-node-id="status-node" data-style-token="status-pass" data-layout-token="badge">

        PASS

      </div>

    


      <ul class="rn-node rn-list-node rn-style-evidence rn-layout-card" data-node-id="evidence-list-node" data-style-token="evidence" data-layout-token="card">

        <li>Sandbox chain passing</li>
<li>Payload validation verified</li>
<li>Renderer output deterministic</li>

      </ul>

    

      </div>

    

  </main>

</body>

</html>
