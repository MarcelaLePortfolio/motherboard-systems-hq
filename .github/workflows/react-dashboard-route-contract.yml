name: react-dashboard-route-contract

on:
  pull_request:
    paths:
      - "server/index.ts"
      - "client/**"
      - "scripts/verify-react-dashboard-route.sh"
      - ".github/workflows/react-dashboard-route-contract.yml"
  push:
    paths:
      - "server/index.ts"
      - "client/**"
      - "scripts/verify-react-dashboard-route.sh"
      - ".github/workflows/react-dashboard-route-contract.yml"

jobs:
  verify-react-dashboard-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Build React dashboard
        working-directory: client
        run: npm run build
      - name: Verify protected React dashboard routing
        run: bash scripts/verify-react-dashboard-route.sh
