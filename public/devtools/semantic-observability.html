
<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>Semantic Observability</title>

  <style>

    body {

      background: #0f1115;

      color: #e6edf3;

      font-family: monospace;

      padding: 24px;

    }

    h1 {

      font-size: 20px;

      margin-bottom: 16px;

    }

    .warning {

      border: 1px solid #ffcc66;

      padding: 12px;

      margin-bottom: 24px;

      background: rgba(255, 204, 102, 0.08);

    }

    .card {

      border: 1px solid #30363d;

      padding: 16px;

      margin-bottom: 16px;

      border-radius: 8px;

      background: #161b22;

    }

    .label {

      color: #7ee787;

      margin-bottom: 8px;

      font-weight: bold;

    }

    .meta {

      color: #79c0ff;

      margin-bottom: 8px;

    }

    pre {

      overflow-x: auto;

      white-space: pre-wrap;

      word-break: break-word;

    }

  </style>

</head>

<body>

  <h1>Semantic Observability Corridor</h1>

  <div class="warning">

    READ-ONLY INSPECTION SURFACE<br><br>

    - No renderer authority<br>

    - No execution mutation<br>

    - No retry coupling<br>

    - No orchestration coupling<br>

    - Metadata visibility only

  </div>

  <div id="results"></div>

  <script>

    async function loadTasks() {

      const results = document.getElementById("results");

      try {

        const response = await fetch("/api/tasks");

        const payload = await response.json();

        const tasks = Array.isArray(payload) ? payload : payload.tasks || [];

        results.innerHTML = "";

        for (const task of tasks.slice(0, 15)) {

          const artifact = task.artifact || null;

          const semanticArtifact =

            artifact?.semantic_artifact ||

            artifact?.semantic ||

            artifact?.semantic_metadata ||

            null;

          const card = document.createElement("div");

          card.className = "card";

          card.innerHTML = `

            <div class="label">${task.title || "Untitled Task"}</div>

            <div class="meta">task_id: ${task.task_id || task.id || "unknown"}</div>

            <div class="meta">status: ${task.status || "unknown"}</div>

            <div class="meta">semantic schema: ${artifact?.semantic_artifact_schema || "none"}</div>

            <div class="meta">semantic validated: ${artifact?.semantic_artifact_validated === true ? "true" : "false"}</div>

            <pre>${JSON.stringify({

              task_id: task.task_id || task.id || null,

              status: task.status || null,

              artifact_type: artifact?.type || null,

              semantic_artifact_schema: artifact?.semantic_artifact_schema || null,

              semantic_artifact_validated: artifact?.semantic_artifact_validated || false,

              semantic_artifact: semanticArtifact

            }, null, 2)}</pre>

          `;

          results.appendChild(card);

        }

      } catch (err) {

        results.innerHTML = `

          <div class="card">

            <div class="label">ERROR</div>

            <pre>${err.stack || err.message}</pre>

          </div>

        `;

      }

    }

    loadTasks();

  </script>

</body>

</html>
