
<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Dashboard V2</title>

  <style>

    body {

      margin: 0;

      font-family: system-ui, sans-serif;

      background: #0b0b0b;

      color: #fff;

    }

    /* OLD DASH-STYLE HEADER */

    header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 14px 16px;

      border-bottom: 1px solid rgba(255,255,255,0.08);

      background: #0a0a0a;

    }

    .title-block p {

      margin: 0;

    }

    .title-small {

      font-size: 11px;

      opacity: 0.6;

      letter-spacing: 0.12em;

      text-transform: uppercase;

    }

    .title-main {

      font-size: 22px;

      font-weight: 700;

    }

    /* GLOBAL STATUS STYLE */

    #global-status {

      display: flex;

      align-items: center;

      gap: 16px;

      background: #111;

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 14px;

      padding: 10px 14px;

    }

    #project-switcher {

      padding: 6px 10px;

      border-radius: 10px;

      background: rgba(255,255,255,0.06);

      font-size: 13px;

    }

    #v2-root {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      padding: 16px;

    }

    .panel {

      background: #111;

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 12px;

      padding: 12px;

      min-height: 120px;

    }

  </style>

</head>

<body>

  <header>

    <div class="title-block">

      <p class="title-small">Motherboard Systems</p>

      <p class="title-main">Operator Console V2</p>

    </div>

    <div id="global-status">

      <span>Uptime: <span id="uptime-display">--</span></span>

      <div style="display:flex; align-items:center; gap:8px;">

        <div id="system-health-indicator" style="width:10px; height:10px; border-radius:50%; background:#22c55e;"></div>

        <span id="health-status">Healthy</span>

      </div>

      <div id="project-switcher">Loading...</div>

    </div>

  </header>

  <div id="v2-root">

    <div class="panel">

      <div>System</div>

      <div id="system-status">--</div>

    </div>

    <div class="panel">

      <div>Project</div>

      <div id="project-info">--</div>

    </div>

  </div>

  <script src="/js/v2-renderer.js"></script>

</body>

</html>
